name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: ACPBOT_SKIP_LIVE_ACP=1 bun test ./test

      - name: Compile smoke (linux-x64)
        run: |
          bun run build:compile
          test -x dist/acpbot
          # Unified binary: host + worker are subcommands of acpbot
          dist/acpbot help | grep -q 'acpbot host'
          dist/acpbot help | grep -q 'acpbot worker'
          ls -la dist/
