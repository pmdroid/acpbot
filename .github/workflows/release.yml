# Build versioned Linux binaries + Docker images when a GitHub Release is published
# (or when a v* tag is pushed). Artifacts are named with the release tag.
#
# Create a release in the GitHub UI (tag v0.1.0) — this workflow:
#   1. Tests
#   2. Compiles Linux worker + host binaries → attach to the release
#   3. Builds/pushes multi-arch Docker image → ghcr.io/<owner>/acpbot:<tag>
#
# macOS (darwin-arm64 / darwin-x64): build + Developer ID sign by hand on a Mac:
#   ./scripts/release-darwin.sh v0.1.0 --upload
name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0). Must already exist for release upload."
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve a single VERSION string used everywhere (v0.1.0)
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_noprefix: ${{ steps.v.outputs.version_noprefix }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # Normalize: ensure leading v
          case "$VERSION" in
            v*) ;;
            *) VERSION="v${VERSION}" ;;
          esac
          NOPREFIX="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_noprefix=${NOPREFIX}" >> "$GITHUB_OUTPUT"
          echo "Building release ${VERSION}"

  test:
    name: test
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: ACPBOT_SKIP_LIVE_ACP=1 bun test ./test

  compile:
    name: binaries
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile versioned binaries
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Embed version stamp (optional runtime import of version.gen.ts)
          printf 'export const ACPBOT_VERSION = "%s";\n' "${VERSION}" > src/version.gen.ts
          # Darwin is NOT built here — codesign requires a Mac + Developer ID.
          # See scripts/release-darwin.sh
          targets=(
            "bun-linux-x64:linux-x64"
            "bun-linux-arm64:linux-arm64"
          )
          for entry in "${targets[@]}"; do
            target="${entry%%:*}"
            suffix="${entry##*:}"
            worker="acpbot-${VERSION}-${suffix}"
            host="acpbot-host-${VERSION}-${suffix}"
            echo "==> ${worker} / ${host}  (${target})"
            bun build --compile --target="$target" \
              --outfile="dist/${worker}" \
              src/main.ts
            bun build --compile --target="$target" \
              --outfile="dist/${host}" \
              src/acp-host/main.ts
            chmod +x "dist/${worker}" "dist/${host}"
            tar -C dist -czf "dist/${worker}.tar.gz" "${worker}"
            tar -C dist -czf "dist/${host}.tar.gz" "${host}"
          done
          # Convenience copies without version (still in tarballs only for GH)
          ls -la dist/
          # SHA256SUMS
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acpbot-binaries-${{ needs.meta.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  docker:
    name: docker
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          # ghcr.io/<owner>/<repo>  (lowercase required)
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "Will push: ${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta_docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=${{ needs.meta.outputs.version_noprefix }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=acpbot
            org.opencontainers.image.description=Telegram control surface for ACP coding agents
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_docker.outputs.tags }}
          labels: ${{ steps.meta_docker.outputs.labels }}
          build-args: |
            ACPBOT_VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Write image digest
        run: |
          echo "Pushed ${{ steps.image.outputs.name }}:${{ needs.meta.outputs.version }}"
          echo "Also tagged :${{ needs.meta.outputs.version_noprefix }} and :latest"

  publish-release:
    name: attach assets to GitHub Release
    needs: [meta, compile, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: acpbot-binaries-${{ needs.meta.outputs.version }}
          path: dist

      - name: Resolve image ref
        id: img
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${OWNER_LC}/${REPO_LC}:${{ needs.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          # Attaches to the existing release (UI) or creates one (tag-only push)
          draft: false
          make_latest: true
          generate_release_notes: true
          append_body: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |

            ---

            ### Binaries (this build)
            Standalone Bun-compiled executables — no Bun install required.

            | Asset | Role |
            |-------|------|
            | `acpbot-${{ needs.meta.outputs.version }}-<platform>.tar.gz` | Telegram worker |
            | `acpbot-host-${{ needs.meta.outputs.version }}-<platform>.tar.gz` | ACP agent host |

            Platforms from CI: `linux-x64`, `linux-arm64`.

            **macOS** binaries are built and Developer ID–signed on a Mac, then
            attached with `./scripts/release-darwin.sh <tag> --upload`
            (`darwin-arm64`, `darwin-x64`).

            ### Docker (GHCR)
            ```bash
            docker pull ${{ steps.img.outputs.ref }}
            # also: :${{ needs.meta.outputs.version_noprefix }} and :latest
            ```

            Image: `${{ steps.img.outputs.ref }}`

            ### Disclaimer
            **Use at your own risk.** Agents can run tools, edit files, and execute
            commands. Authors are **not responsible** for damage, data loss, or costs.
            See [LICENSE](LICENSE) (MIT) and the README disclaimer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
