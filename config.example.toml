# acpbot configuration (reference template)
#
# First run creates ~/.config/acpbot/config.toml automatically and the worker
# prompts for bot_token in the terminal. You only need this file if you prefer
# to hand-edit before starting.
#
# Operator pairing is NOT in this file — DM the bot, then:
#   acpbot pair approve <code>
#
# Defaults (when omitted below):
#   store_path = ~/.local/share/acpbot/store.json
#   state_dir  = ~/.local/share/acpbot/state
#
# Override path:  acpbot --config /path/to/config.toml
#                 ACPBOT_CONFIG=/path/to/config.toml

# ── Required ───────────────────────────────────────────────────────────────
bot_token = "123456:REPLACE_ME"          # from @BotFather

# Optional: pin the private chat id (auto-learned from first operator message)
# operator_chat_id = 0

# ── Paths (optional — XDG defaults apply) ──────────────────────────────────
# store_path = "~/.local/share/acpbot/store.json"
# state_dir  = "~/.local/share/acpbot/state"

default_agent = "grok-build"             # grok-build | claude | codex | opencode
log_level = "info"                       # debug | info | warn | error | silent

# ── Repos for /new picker + schedule scan ──────────────────────────────────
# Keys are short labels; values are absolute working directories.
# Manage with: acpbot repo | acpbot repo add | acpbot repo browse
[repos]
# demo = "/Users/you/code/demo"
# acpbot = "/Users/you/code/acpbot"

# ── Features ───────────────────────────────────────────────────────────────
[features]
mcp = true                               # inject host MCP tools (update, speak, …)
tts_mode = "agent"                       # agent | always | off
# permission_mode = "ask"                # ask | bypass (tool auto-allow)
#   ask            → Telegram approve/reject buttons (safe default)
#   bypass → auto-allow tools; Grok gets --always-approve / yoloMode
# Override per topic: /permissions ask|bypass
# Default for new topics: /permissions default ask|bypass
# acp_media_attachments = false          # ACP image/audio blocks (agent-dependent)
# stt = true                             # speech-to-text when a key is set
# verbose = false

# ── Remote MCP OAuth (optional) ────────────────────────────────────────────
# Always listen on 8788. MagicDNS uses https:// + Tailscale certs; IP stays http://
# Certs: ~/.local/share/tailscale-certs/<dns>.crt|.key  (auto-detected)
[oauth]
# callback_base = "https://your-host.ts.net:8788"  # MagicDNS HTTPS on :8788
# listen_host = "0.0.0.0"
# listen_port = 8788
# tls_cert = "~/.local/share/tailscale-certs/your-host.ts.net.crt"  # optional; auto-detected
# tls_key  = "~/.local/share/tailscale-certs/your-host.ts.net.key"
# # HTTP fallback: callback_base = "http://100.x.y.z:8788"

# ── Schedules (acp-host ticker) ────────────────────────────────────────────
[schedule]
# tick_ms = 20000

# ── Extra skill roots (optional) ───────────────────────────────────────────
[skills]
# roots = ["/path/to/extra-skills"]

# ── Speech (TTS / STT — independent providers) ─────────────────────────────
# Providers: auto | elevenlabs | openai | off
#   auto = ElevenLabs if its key is set, else OpenAI
[speech]
# tts_provider = "auto"
# stt_provider = "auto"

# Or nest for clarity:
# [speech.tts]
# provider = "openai"
# model = "tts-1"          # tts-1 | tts-1-hd | gpt-4o-mini-tts
# voice = "alloy"          # alloy | nova | onyx | …
# format = "opus"          # opus | mp3 (Telegram voice notes prefer opus)
#
# [speech.stt]
# provider = "openai"
# model = "whisper-1"      # whisper-1 | gpt-4o-mini-transcribe | …

[speech.openai]
# api_key = "sk-…"
# base_url = "https://api.openai.com/v1"   # or Azure/OpenAI-compatible proxy
# tts_model = "tts-1"
# tts_voice = "alloy"
# tts_format = "opus"
# stt_model = "whisper-1"

[speech.elevenlabs]
# api_key = ""
# voice_id = ""
# tts_model = "eleven_multilingual_v2"
# stt_model = "scribe_v1"
# base_url = "https://api.elevenlabs.io"

# ── Agent launch overrides (optional) ──────────────────────────────────────
[agents]
# claude_acp_pkg = "@agentclientprotocol/claude-agent-acp@0.64.0"
# codex_acp_pkg = "@agentclientprotocol/codex-acp@1.1.7"
# command_json = '{"grok-build":{"command":"grok","args":["agent","stdio"]}}'

# ── Multi-host (optional) ───────────────────────────────────────────────────
# Default is local Unix acp-host only. To run agents on another machine:
#   1) On the remote host: acpbot host with [host_listen] token + port
#   2) On the worker: [hosts.<id>] kind=wss url=… token=…
#   3) Bind a repo: [repos.work] path=… host=<id>
# Never silently falls back to local if a remote host is configured/unreachable.
#
# [host_listen]
# port = 8790
# host = "0.0.0.0"
# token = "env:ACPBOT_HOST_TOKEN"
#
# [hosts.studio]
# kind = "wss"
# url = "wss://studio.example.com:8790"
# token = "env:ACPBOT_HOST_TOKEN_STUDIO"
#
# [repos.work]
# path = "/data/work"
# host = "studio"
