# Isolated acp-host + worker. Agents and repo trees are mounted; network is
# internal except OAuth (optional) and outbound HTTPS for Telegram/agents.
#
# Local build:
#   cp config.example.toml config.toml   # bot_token, operator_user_id, [repos]
#   # set store_path/state_dir under /data inside the TOML for containers
#   docker compose up --build
#
# From a GitHub Release image (tag = release tag, e.g. v0.1.0):
#   export ACPBOT_IMAGE=ghcr.io/<owner>/<repo>:v0.1.0
#   docker compose up -d
#
# Repos: map host paths into /repos and set [repos] in config.toml, e.g.
#   demo = "/repos/demo"
#
# WARNING: Agents may run arbitrary tools against mounted repos. You are
# solely responsible for what they do. See README disclaimer + LICENSE.

services:
  acp-host:
    build: .
    image: ${ACPBOT_IMAGE:-acpbot:local}
    command: ["host"]
    restart: unless-stopped
    environment:
      ACPBOT_CONFIG: /data/config.toml
      # Optional env overrides if not set in TOML:
      ACPBOT_STATE_DIR: /data/state
    volumes:
      - acpbot-data:/data
      - ${ACPBOT_CONFIG_HOST:-./config.toml}:/data/config.toml:ro
      - ${ACPBOT_REPOS_HOST:-./repos}:/repos
    ports:
      - "${ACPBOT_OAUTH_PUBLISH_PORT:-8788}:8788"
    networks:
      - acpbot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -S /data/state/acp-host.sock || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    image: ${ACPBOT_IMAGE:-acpbot:local}
    build: .
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      acp-host:
        condition: service_healthy
    environment:
      ACPBOT_CONFIG: /data/config.toml
      ACPBOT_STATE_DIR: /data/state
      ACPBOT_STORE_PATH: /data/store.json
    volumes:
      - acpbot-data:/data
      - ${ACPBOT_CONFIG_HOST:-./config.toml}:/data/config.toml:ro
      - ${ACPBOT_REPOS_HOST:-./repos}:/repos
    networks:
      - acpbot
    # Worker only needs the host socket + outbound HTTPS (Telegram, APIs).
    # No published ports by default.

networks:
  acpbot:
    driver: bridge

volumes:
  acpbot-data:
    name: acpbot-data
