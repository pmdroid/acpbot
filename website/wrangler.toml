# Cloudflare Pages — static Astro site
# Dashboard (recommended): set Root directory = website
#   Build command: bun run build
#   Build output directory: dist
#
# From repo root (if Root directory is empty):
#   Build command: bun run website:build
#   Build output directory: website/dist
#   (use the root wrangler.toml in that case, or override output in the dashboard)

name = "acpbot"
compatibility_date = "2025-08-01"
pages_build_output_dir = "dist"
